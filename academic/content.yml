    items:
      - title:
          en: LLM-Based Corporate Culture Identification and Characterization
          zh: 基于大语言模型的企业文化识别与表征
        organization:
          en: 47th SJTU Undergraduate Research Program (PRP)
          zh: 上海交通大学第 47 期本科生研究计划（PRP）
        details:
          en: |
            Built a pipeline using DeepSeek to extract and quantify corporate culture from 1,381 annual reports. Evaluated model reliability through cross-model validation and ablation studies, and built causal knowledge graphs for structured reasoning.

            Received the university-level Outstanding Project Award (top 15%).
          zh: |
            使用 DeepSeek 从 1,381 份年报中提取并量化企业文化。通过跨模型验证和消融实验评估模型可靠性，并构建因果知识图谱用于结构化推理。

            获校级优秀项目奖（前 15%）。

