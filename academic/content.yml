      en: Academic Service
      zh: 学术服务
    items:
      - period:
          en: 20XX
          zh: 20XX
        title:
          en: Reviewer or Committee Role
          zh: 审稿或委员会职务
        organization:
          en: Conference, Journal, or Organization
          zh: 会议、期刊或组织
        location:
          en: ""
          zh: ""
