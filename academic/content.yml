          zh: 添加有关该学术服务的可选说明。
        links: []

  talks:
    enabled: false
    title:
      en: Talks
      zh: 学术报告
    items:
      - period:
          en: YYYY.MM
          zh: YYYY.MM
        title:
          en: Title of Your Talk
          zh: 报告题目
        organization:
          en: Host Organization or Event
